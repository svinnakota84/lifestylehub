name: Deploy public LifestyleHub site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build application from current source
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
          mkdir -p _site/assets/aistudio
          cp -R dist/. _site/
          cp CNAME .nojekyll _site/
          cp image_*.png _site/assets/aistudio/
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish verified files
        id: deployment
        uses: actions/deploy-pages@v4
