name: Deploy public LifestyleHub site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files and verify entry assets
        run: |
          mkdir -p _site/assets/aistudio
          cp index.html *.js *.css icon.svg manifest.webmanifest CNAME .nojekyll _site/
          cp image_*.png _site/assets/aistudio/
          cp index.html _site/404.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('_site/index.html').read_text()
          for url in re.findall(r'(?:src|href)="(/[^"?]+)', html):
              assert Path('_site', url.lstrip('/')).is_file(), f'Missing site asset: {url}'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish verified files
        id: deployment
        uses: actions/deploy-pages@v4
